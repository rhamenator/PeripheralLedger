[package]
name = "peripheral-ledger"
version = "0.1.0"
edition = "2024"
authors = ["Richard M. Hamilton"]
description = "Tamper-evident Windows peripheral event auditing service"
repository = "https://github.com/rhamenator/PeripheralLedger"

[package.metadata.wix]
upgrade-guid = "5F29805E-4FF1-41B1-B396-52646167ED33"
path-guid = "1ABC777E-221A-4692-9D2E-75C18FED06A5"
license = false
eula = false
product-icon = "wix\\Product.ico"

[dependencies]
anyhow = "1"
csv = "1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_EventLog",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging"
] }
windows-service = "0.8.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
